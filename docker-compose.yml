services:
  postgres:
    image: postgres:16-alpine
    container_name: art-gallery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: art_gallery
      POSTGRES_PASSWORD: art_gallery_password
      POSTGRES_DB: art_gallery_db
    ports:
      - '5432:5432'
    volumes:
      - art_gallery_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U art_gallery -d art_gallery_db']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  art_gallery_postgres_data:
